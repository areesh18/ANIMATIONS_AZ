<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>GSAP Horizontal Scroll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Spacer sections */
        .spacer {
            height: 100vh;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        /* Horizontal scroll section */
        .h-wrapper {
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .h-container {
            display: flex;
            height: 100vh;
        }

        .panel {
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }

        .panel:nth-child(1) {
            background: #e63946;
        }

        .panel:nth-child(2) {
            background: #457b9d;
        }

        .panel:nth-child(3) {
            background: #2a9d8f;
        }

        .panel:nth-child(4) {
            background: #f4a261;
        }
    </style>
</head>

<body>

    <section class="spacer">Scroll Down</section>

    <section class="h-wrapper">
        <div class="h-container">
            <div class="panel">Panel 1</div>
            <div class="panel">Panel 2</div>
            <div class="panel">Panel 3</div>
            <div class="panel">Panel 4</div>
        </div>
    </section>

    <section class="spacer">Scroll End</section>

    <!-- GSAP CDN -->
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const container = document.querySelector(".h-container");

        gsap.to(container, {
            x: () => -(container.scrollWidth - window.innerWidth),
            ease: "none",
            scrollTrigger: {
                trigger: ".h-wrapper",
                start: "top top",
                end: () => "+=" + container.scrollWidth,
                pin: true,
                scrub: true,
                snap: {                      
                    snapTo: 1 / (container.children.length - 1),
                    duration: 0.5,
                    delay: 0.1,
                    ease: "power1.inOut"
                },
                invalidateOnRefresh: true,
                
                markers: false // set true for debugging

            }

        });
    </script>

</body>

</html>
